name: CI e deploy do Ecovit no aaPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecovit-production
  cancel-in-progress: false

jobs:
  ci:
    name: Validar Ecovit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.22.1", "24.x"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar código
        run: npm run lint

      - name: Executar testes
        run: npm test -- --maxWorkers=1

      - name: Verificar tipos e compilar
        run: npm run build

  deploy:
    name: Implantar revisão validada no aaPanel
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.AAPANEL_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Acionar webhook do Ecovit e conferir a revisão
        shell: bash
        env:
          AAPANEL_WEBHOOK_URL: ${{ secrets.AAPANEL_WEBHOOK_URL }}
        run: |
          if [[ "$AAPANEL_WEBHOOK_URL" != https://* ]]; then
            echo "Configure o segredo AAPANEL_WEBHOOK_URL com o webhook HTTPS do Ecovit."
            exit 1
          fi
          run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          status=$(curl --fail --silent --show-error --request POST \
            --connect-timeout 15 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            --url-query "param=$GITHUB_SHA-$run_key" \
            "$AAPANEL_WEBHOOK_URL")
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "O webhook do aaPanel respondeu com HTTP $status."
            exit 1
          fi

          echo "Webhook aceito. Aguardando a publicação da revisão $GITHUB_SHA."
          origin=https://ecovit.idevs.com.br
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            query="verify=$run_key-$SECONDS"
            if receipt=$(curl --fail --silent --max-time 10 \
              --header 'Cache-Control: no-cache' "$origin/ecovit-deploy.txt?$query"); then
              index_hash=${receipt##* }
              if [[ "$index_hash" =~ ^[0-9a-f]{64}$ && "$receipt" == "$GITHUB_SHA $run_key $index_hash" ]] &&
                public_index=$(curl --fail --silent --max-time 10 \
                  --header 'Cache-Control: no-cache' "$origin/?$query" |
                  perl -0777 -pe '
                    s{<script>(.*?)</script>}{
                      index($1, q{window.__CF$cv$params}) >= 0 &&
                      index($1, q{/cdn-cgi/challenge-platform/scripts/jsd/}) >= 0 ? q{} : $&
                    }gse
                  ' | sha256sum) &&
                [[ "${public_index%% *}" == "$index_hash" ]] &&
                health=$(curl --fail --silent --max-time 10 "$origin/api/health") &&
                [[ "$health" == '{"ok":true}' ]]; then
                printf 'Revisão implantada e verificada em produção: %s\n' "$GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Publicação da revisão $GITHUB_SHA não confirmada em 15 minutos. Confira o log do webhook no aaPanel."
          exit 1
